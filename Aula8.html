<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 8</title>
</head>
<body>
    <h1>Texto</h1>
    <p>Esse é um parágrafo.</p>
    <button id="meuBotao">AAA</button>

    <style>
        h1, p {
            font-family: 'Lucida Sans';
            color: darkblue;
        }
        .Classe{
            background-color: lightblue;
            color: darkblue;
            font-family: 'Lucida Sans';
        }
    </style>

    <script>
    //1. Altere o texto de um elemento h1 via JavaScript.
    document.querySelector("h1").textContent = "Um Grande Texto";
    //2. Mude a cor de fundo de um parágrafo ao carregar a página.
    let paragrafo = document.querySelector("p"); 
    paragrafo.style.backgroundColor = "lightblue";
    //3. Adicione uma classe CSS a um botão existente.
    let botao = document.getElementById("meuBotao");
    botao.classList.add("Classe");
    </script>
    

</body>
</html>
